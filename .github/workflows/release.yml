name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: Semantic version to package, without the v prefix
        required: true
        type: string

permissions:
  contents: write

jobs:
  package-and-release:
    runs-on: windows-2022
    timeout-minutes: 45

    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Cache pinned .NET SDK
        uses: actions/cache@v4
        with:
          path: .dotnet
          key: ${{ runner.os }}-dotnet-sdk-${{ hashFiles('global.json') }}

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('NuGet.config', '**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Resolve release version
        id: version
        shell: pwsh
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_VERSION: ${{ inputs.version }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          $version = if ($env:EVENT_NAME -eq 'workflow_dispatch') { $env:INPUT_VERSION } else { $env:REF_NAME.TrimStart('v') }
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Bootstrap pinned .NET SDK
        shell: pwsh
        run: ./scripts/bootstrap.ps1

      - name: Build
        shell: pwsh
        run: ./scripts/build.ps1 -Configuration Release -Version '${{ steps.version.outputs.version }}'

      - name: Test
        shell: pwsh
        run: ./scripts/test.ps1 -Configuration Release -NoRestore -NoBuild

      - name: Package Windows x64 release
        shell: pwsh
        run: ./scripts/package.ps1 -Version '${{ steps.version.outputs.version }}' -SkipBuild

      - name: Verify release archive layouts
        shell: pwsh
        run: ./scripts/verify-release-assets.ps1 -Version '${{ steps.version.outputs.version }}'

      - name: Upload runnable program artifact
        uses: actions/upload-artifact@v4
        with:
          name: Loopstructor.AutoPlayer-${{ steps.version.outputs.version }}-win-x64
          path: artifacts/package/Loopstructor 2.AutoPlayer/
          if-no-files-found: error
          retention-days: 30

      - name: Download runnable artifact for verification
        uses: actions/download-artifact@v4
        with:
          name: Loopstructor.AutoPlayer-${{ steps.version.outputs.version }}-win-x64
          path: artifacts/workflow-artifact-verification

      - name: Verify runnable artifact layout
        shell: pwsh
        run: |
          $artifactRoot = Join-Path $env:GITHUB_WORKSPACE 'artifacts\workflow-artifact-verification'
          $requiredFiles = @(
            'Loopstructor.AutoPlayer.Manager.exe'
            'autoplayer-release.json'
            'checksums.sha256'
            'manager/Loopstructor.AutoPlayer.Manager.exe'
            'manager/Loopstructor.AutoPlayer.Manager.dll'
            'manager/Loopstructor.AutoPlayer.Updater.exe'
            'manager/Loopstructor.AutoPlayer.Updater.dll'
            'manager/Loopstructor.AutoPlayer.Updater.deps.json'
            'manager/Loopstructor.AutoPlayer.Updater.runtimeconfig.json'
            'manager/coreclr.dll'
            'manager/PresentationFramework.dll'
            'manager/PresentationCore.dll'
            'manager/WindowsBase.dll'
          )
          foreach ($relativePath in $requiredFiles) {
            $path = Join-Path $artifactRoot $relativePath
            if (-not (Test-Path -LiteralPath $path -PathType Leaf)) {
              throw "Workflow artifact is missing required file: $relativePath"
            }
          }

          foreach ($relativePath in @('manager', 'payload')) {
            $path = Join-Path $artifactRoot $relativePath
            if (-not (Test-Path -LiteralPath $path -PathType Container)) {
              throw "Workflow artifact is missing root directory: $relativePath"
            }
          }

          if (Test-Path -LiteralPath (Join-Path $artifactRoot 'updater')) {
            throw 'Workflow artifact must not contain the retired updater compatibility directory.'
          }

          $marker = Get-Content -LiteralPath (Join-Path $artifactRoot 'autoplayer-release.json') -Raw | ConvertFrom-Json
          if ($marker.managerPath -ne 'Loopstructor.AutoPlayer.Manager.exe') {
            throw "Workflow artifact Manager entry point is not at the root: $($marker.managerPath)"
          }
          if ($marker.updaterPath -cne 'manager/Loopstructor.AutoPlayer.Updater.exe') {
            throw "Workflow artifact Updater entry point is incorrect: $($marker.updaterPath)"
          }

          $nestedProductZips = @(Get-ChildItem -LiteralPath $artifactRoot -Recurse -File -Filter '*.zip')
          if ($nestedProductZips.Count -ne 0) {
            throw "Workflow artifact root must contain runnable files, not a nested product ZIP: $($nestedProductZips.Name -join ', ')"
          }

      - name: Publish GitHub release
        if: github.event_name == 'push'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $assets = @(Get-ChildItem -LiteralPath artifacts/release -File | ForEach-Object { $_.FullName })
          gh release view $env:GITHUB_REF_NAME *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $env:GITHUB_REF_NAME @assets --clobber
          } else {
            gh release create $env:GITHUB_REF_NAME @assets --verify-tag --generate-notes --title "Loopstructor AutoPlayer $env:GITHUB_REF_NAME"
          }
          if ($LASTEXITCODE -ne 0) {
            throw "GitHub release publishing failed with exit code $LASTEXITCODE."
          }
