name: CI

on:
  push:
    branches:
      - '**'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: windows-2022
    timeout-minutes: 45

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.19.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: desktop/pnpm-lock.yaml

      - name: Restore desktop dependencies
        working-directory: desktop
        shell: pwsh
        run: pnpm install --frozen-lockfile

      - name: Cache pinned .NET SDK
        uses: actions/cache@v4
        with:
          path: .dotnet
          key: ${{ runner.os }}-dotnet-sdk-${{ hashFiles('global.json') }}

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('NuGet.config', '**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Bootstrap pinned .NET SDK
        shell: pwsh
        run: ./scripts/bootstrap.ps1

      - name: Build
        shell: pwsh
        run: ./scripts/build.ps1 -Configuration Release

      - name: Test
        shell: pwsh
        run: ./scripts/test.ps1 -Configuration Release -NoRestore -NoBuild

      - name: Electron desktop smoke test
        working-directory: desktop
        shell: pwsh
        run: pnpm test:e2e

      - name: Validate release scripts
        shell: pwsh
        run: |
          foreach ($script in @('scripts/common.ps1', 'scripts/package-delta.ps1', 'scripts/verify-release-assets.ps1')) {
            $tokens = $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $script),
              [ref]$tokens,
              [ref]$errors) | Out-Null
            if ($errors.Count -ne 0) {
              throw "PowerShell parse failed for $script`: $($errors -join '; ')"
            }
          }
          . ./scripts/common.ps1
          if ((Compare-CanonicalSemanticVersion -Left '0.5.2' -Right '0.5.3') -ne -1 -or
              (Compare-CanonicalSemanticVersion -Left '1.0.0-alpha.2' -Right '1.0.0-alpha.10') -ne -1 -or
              (Compare-CanonicalSemanticVersion -Left '1.0.0+build.1' -Right '1.0.0+build.2') -ne 0 -or
              (Test-CanonicalSemanticVersion -Value '1.0.0-alpha.01')) {
            throw 'Release script semantic-version validation failed.'
          }

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: artifacts/TestResults/**/*.trx
          if-no-files-found: ignore
          retention-days: 14
